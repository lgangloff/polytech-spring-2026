/*
 * Point de départ : Java seul, sans dépendance externe.
 *
 * Spring est introduit à la branche 02-ioc-spring, où ce fichier devient le
 * build.gradle de référence du cours.
 */

plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.polytech.spring.App'
}

tasks.named('test') {
    useJUnitPlatform()
}
