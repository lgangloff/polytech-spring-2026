/*
 * build.gradle de référence du cours (slide « Le build.gradle de référence »).
 *
 * Aucune version n'est fixée manuellement sur les dépendances Spring : le
 * plugin io.spring.dependency-management importe le BOM Spring Boot, qui aligne
 * les versions entre elles. Une seule version est à faire évoluer, celle du
 * plugin org.springframework.boot.
 */

plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot'        version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // le conteneur IoC : seule dépendance requise pour ce chapitre
    implementation 'org.springframework:spring-context'
    // @PostConstruct / @PreDestroy
    implementation 'jakarta.annotation:jakarta.annotation-api'

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.polytech.spring.App'
}

tasks.named('test') {
    useJUnitPlatform()
}
