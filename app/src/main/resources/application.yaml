spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/covid-db
    username: postgres
    password: password
  jpa:
    hibernate:
      # create-drop : le schéma est recréé à chaque démarrage. Adapté au
      # développement. En production, le schéma est géré par un outil de
      # migration versionné — Flyway ou Liquibase — et non par ddl-auto.
      ddl-auto: create-drop
    show-sql: true
    # false : la session Hibernate est fermée dès la sortie du service.
    # Laisser open-in-view actif, valeur par défaut de Spring Boot, supprimerait
    # la LazyInitializationException, au prix de requêtes SQL déclenchées par le
    # sérialiseur, hors de tout contrôle. C'est la moins bonne des trois
    # solutions apparentes examinées au chapitre suivant.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    # requis : sans cette propriété, data.sql s'exécute avant la création des tables
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  mvc:
    # Pourquoi la console reste silencieuse quand GET /patients échoue.
    #
    # Jackson ne parvient pas à sérialiser le proxy LAZY du médecin traitant :
    # la LazyInitializationException est encapsulée dans une
    # HttpMessageNotWritableException par le convertisseur de message. Cette
    # exception fait partie de celles que ResponseEntityExceptionHandler traite
    # par défaut, et ApiExceptionHandler en hérite. L'exception est donc
    # résolue : elle ne remonte pas jusqu'au conteneur, seul à écrire une stack
    # trace en ERROR.
    #
    # Spring ne trace une exception résolue qu'en DEBUG. Cette propriété la fait
    # passer en WARN, sous la forme d'une ligne « Resolved [...] » portant la
    # chaîne des causes. Sans elle, le seul signe de l'échec est le 500
    # application/problem+json renvoyé au client.
    log-resolved-exception: true
